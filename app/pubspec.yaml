name: harb_al_oqool
description: "حرب العقول — لعبة معلومات وغزو أراضٍ جماعية (Android)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  web_socket_channel: ^3.0.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/maps/templates/
    - assets/armies/commanders/
    - assets/armies/forts/
    - assets/armies/soldiers/
    - assets/ui/
    - assets/ui/menu/
    - assets/ui/lobby/
    - assets/ui/powerups/
    - assets/ui/abilities/
    - assets/audio/sfx/
    - assets/audio/private/
    - assets/questions/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
